plugins {
    alias(libs.plugins.android.application)
}


// Create a variable called keystorePropertiesFile, and initialize it to your
// keystore.properties file, in the rootProject folder.
def keystorePropertiesFile = rootProject.file("../signing-keys/fifteen/.keys/keystore.properties")

// Initialize a new Properties() object called keystoreProperties.
def keystoreProperties = new Properties()

// Load your keystore.properties file into the keystoreProperties object.
keystoreProperties.load(new FileInputStream(keystorePropertiesFile))


android {
    namespace 'ru.narod.nod.fifteen'
    compileSdk 37

    defaultConfig {
        applicationId "ru.narod.nod.fifteen"
        minSdk 23
        targetSdk 37
        versionCode commitCount()
        versionName "1.3.0"
    }
    signingConfigs {
        // Keys are kept on git@gitlab.com:neronovs/signing-keys.git
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "PROGRAM_NAME", '"AnCalc DEBUG"'
        }
        release {
            signingConfig signingConfigs.release
            buildConfigField "String", "PROGRAM_NAME", '"AnCalculator :)"'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility = '17'
        targetCompatibility = '17'
    }
    buildFeatures {
        buildConfig = true
    }
    viewBinding {
        enabled = true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation libs.androidx.core.ktx
    implementation libs.play.services.ads.lite
    implementation libs.androidx.constraintlayout
    testImplementation libs.junit
}

def commitCount() {
    final String output = providers.exec {
        commandLine 'git', 'rev-list', '--count', '--full-history', '--all'
    }.standardOutput.asText.get().trim()
    final int code = output.toInteger()
    println("Version Code: " + code)
    return code
}